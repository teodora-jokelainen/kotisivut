<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mallikotisivu</title>
    <style>
        /* Perustyylit */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f4f7f6;
        }

        /* Navigaatio */
        header {
            background-color: #2c3e50;
            color: #ffffff;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.5rem;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            margin-left: 1.5rem;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #1abc9c;
        }

        /* Hero-osio */
        .hero {
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://picsum.photos/1200/500') no-repeat center center/cover;
            color: white;
            text-align: center;
            padding: 5rem 1rem;
        }

        .hero h2 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .hero p {
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
        }

        .btn {
            display: inline-block;
            background-color: #1abc9c;
            color: white;
            padding: 0.75rem 1.5rem;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.3s;
        }

        .btn:hover {
            background-color: #16a085;
        }

        /* Sisältöalue */
        .container {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .services {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .card {
            background: white;
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .card h3 {
            margin-bottom: 0.5rem;
            color: #2c3e50;
        }

        /* Alatunniste */
        footer {
            text-align: center;
            padding: 1.5rem;
            background-color: #2c3e50;
            color: white;
            margin-top: 3rem;
        }
    </style>
</head>
<body>

    <!-- Yläpalkki -->
    <header>
        <h1>Yritys Oy</h1>
        <nav>
            <a href="#koti">Koti</a>
            <a href="#palvelut">Palvelut</a>
            <a href="#meista">Meistä</a>
            <a href="#yhteystiedot">Yhteystiedot</a>
        </nav>
    </header>

    <!-- Pääkuvaosa (Hero) -->
    <section class="hero" id="koti">
        <h2>Tervetuloa nykyaikaisille kotisivuille</h2>
        <p>Autamme sinua tote
